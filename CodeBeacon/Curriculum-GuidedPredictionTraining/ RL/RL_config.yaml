ray job submit --address="http://127.0.0.1:8265" \
        --runtime-env=$RUNTIME_SCRIPT_DIR/runtime_env.yaml \
        -- \
        python3 -m verl.trainer.main_ppo \
        algorithm.adv_estimator=grpo \
        data.train_files=$TRAIN_DATA_PATH \
        data.val_files=null \
        data.train_batch_size=512 \
        data.max_prompt_length=300 \
        data.max_response_length=7892 \
        data.filter_overlong_prompts=True \
        data.truncation='error' \
        +data.segment_shuffle_size=512 \
        actor_rollout_ref.model.path=Qwen3-4B-SFT \
        actor_rollout_ref.actor.shuffle=True \
        actor_rollout_ref.actor.optim.lr=1e-5 \
        actor_rollout_ref.model.use_remove_padding=True \
        actor_rollout_ref.actor.ppo_mini_batch_size=256 \
        actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=8 \
        actor_rollout_ref.actor.use_kl_loss=False \
        actor_rollout_ref.actor.entropy_coeff=0.002 \
        actor_rollout_ref.model.enable_gradient_checkpointing=True \
        actor_rollout_ref.actor.fsdp_config.param_offload=False \
        actor_rollout_ref.actor.fsdp_config.optimizer_offload=False \
        actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=8 \
        actor_rollout_ref.rollout.tensor_model_parallel_size=8 \
        actor_rollout_ref.rollout.name=vllm \
        actor_rollout_ref.rollout.gpu_memory_utilization=0.4 \
        actor_rollout_ref.rollout.n=16 \
        actor_rollout_ref.rollout.max_num_batched_tokens=8192 \
        actor_rollout_ref.rollout.calculate_log_probs=True \
        +actor_rollout_ref.rollout.repeat_truncation_n=400 \
        +actor_rollout_ref.rollout.repeat_truncation_prob=0.99 \
        actor_rollout_ref.actor.checkpoint.save_contents=['model','hf_model','optimizer','extra'] \
        actor_rollout_ref.actor.clip_ratio_high=0.2 \
        custom_reward_function.path=custom_reward.py \
        custom_reward_function.name=my_reward_function \
        trainer.critic_warmup=0 \
        trainer.logger=['console','tensorboard'] \
        +trainer.rollout_data_dir=${dump_dir} \
        trainer.project_name='verl_grpo_xwi_compile_debug_analysis_qwen3-4b' \
        trainer.experiment_name='qwen3-4b-start_from_pretrained-exp_length' \
        trainer.n_gpus_per_node=$HOST_GPU_NUM \
        trainer.nnodes=$HOST_NUM \
        trainer.save_freq=1 \
        trainer.test_freq=-1 \
        trainer.default_local_dir=${CKPT_PATH} \
        trainer.total_epochs=40 \
        trainer.val_before_train=False \
        reward_model.reward_manager=apiprime  \
        2>&1 | ts '[%Y-%m-%d %H:%M:%S]' | tee ${current_log_file}
